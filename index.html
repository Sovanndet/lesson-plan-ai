<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Lesson Assistant V2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    
    <!-- បន្ថែម Library សម្រាប់ទាញយកជា PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --ink: #1a1208; --paper: #f9f6f0; --gold: #c8922a;
            --teal: #1b6b6b; --white: #ffffff; --sidebar: #f0ede5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Battambang', cursive; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; height: 100vh; }

        /* Navbar */
        nav { background: var(--white); border-bottom: 1px solid #ddd; padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Moul', serif; color: var(--teal); font-size: 1.2rem; }
        .btn-download { background: #27ae60; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 5px; cursor: pointer; font-family: 'Battambang'; font-weight: bold; }

        /* Main */
        main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 350px; background: var(--sidebar); border-right: 1px solid #ddd; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .input-group label { display: block; font-size: 0.75rem; color: #777; margin-bottom: 0.4rem; font-weight: bold; }
        .input-group input, .input-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-family: 'Battambang'; }

        .btn-generate { background: var(--teal); color: white; padding: 1rem; border: none; border-radius: 8px; font-family: 'Moul'; cursor: pointer; transition: 0.3s; }
        .btn-generate:hover { background: #145252; }

        /* Preview Area */
        .preview-area { flex: 1; padding: 2rem; overflow-y: auto; background: #ccc; display: flex; justify-content: center; }
        .lesson-sheet { width: 210mm; min-height: 297mm; background: white; padding: 20mm; box-shadow: 0 0 10px rgba(0,0,0,0.2); }

        table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        td, th { border: 1px solid #000; padding: 8px; font-size: 1rem; }
        .label-cell { background: #f2f2f2; font-weight: bold; width: 120px; }
        .moul { font-family: 'Moul', serif; color: var(--teal); text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body>

<nav>
    <div class="logo">📄 Khmer Lesson AI</div>
    <!-- ប៊ូតុងទាញយកដែលនឹងដើរពិតប្រាកដ -->
    <button class="btn-download" onclick="downloadPDF()">📥 ទាញយក (កិច្ចតែងការ)</button>
</nav>

<main>
    <aside class="sidebar">
        <div class="input-group">
            <label>ឈ្មោះគ្រូបង្រៀន</label>
            <input type="text" id="teacherIn" placeholder="ហាន ម៉ុម">
        </div>
        <div class="input-group">
            <label>ចំណងជើងមេរៀន</label>
            <textarea id="topicIn" rows="3" placeholder="ឧទាហរណ៍៖ រឿង ទឹកចិត្តបុរសម្នាក់"></textarea>
        </div>
        <button class="btn-generate" onclick="generateContent()">✨ បង្កើតកិច្ចតែងការ</button>
    </aside>

    <section class="preview-area">
        <!-- ផ្នែកដែលនឹងត្រូវទាញយកជា PDF -->
        <div class="lesson-sheet" id="lesson-content">
            <h2 class="moul">កិច្ចតែងការបង្រៀន</h2>
            <table>
                <tr>
                    <td class="label-cell">គ្រូបង្រៀន</td>
                    <td id="out-teacher" contenteditable="true">ហាន ម៉ុម</td>
                    <td class="label-cell">កាលបរិច្ឆេទ</td>
                    <td contenteditable="true">30/04/2026</td>
                </tr>
                <tr>
                    <td class="label-cell">ចំណងជើង</td>
                    <td colspan="3" id="out-title" style="font-weight:bold;" contenteditable="true">បញ្ចូលចំណងជើងមេរៀន...</td>
                </tr>
            </table>

            <div style="border: 1px solid #000; padding: 15px; margin-bottom: 20px;">
                <h4 style="font-family: 'Moul'; font-size: 0.9rem;">វត្ថុបំណង៖</h4>
                <div id="out-aims" contenteditable="true">-- ចុចប៊ូតុងបង្កើតដើម្បីបំពេញ --</div>
            </div>

            <table>
                <thead>
                    <tr style="background: #eee;">
                        <th>សកម្មភាពគ្រូ</th>
                        <th>សកម្មភាពសិស្ស</th>
                    </tr>
                </thead>
                <tbody id="out-activities" contenteditable="true">
                    <tr>
                        <td>- សំណួររំលឹកមេរៀន</td>
                        <td>- សិស្សឆ្លើយសំណួរ</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
    // ១. មុខងារបង្កើតខ្លឹមសារ
    function generateContent() {
        const teacher = document.getElementById('teacherIn').value || "ហាន ម៉ុម";
        const topic = document.getElementById('topicIn').value || "មេរៀនថ្មី";

        document.getElementById('out-teacher').innerText = teacher;
        document.getElementById('out-title').innerText = topic;
        document.getElementById('out-aims').innerHTML = `
            - វិជ្ជាសម្បទា៖ សិស្សយល់ដឹងពី ${topic} បានច្បាស់។<br>
            - បំណិនសម្បទា៖ សិស្សចេះអនុវត្តលំហាត់ទាក់ទងនឹង ${topic}។
        `;
        document.getElementById('out-activities').innerHTML = `
            <tr><td>- ពន្យល់ពី ${topic}</td><td>- ស្តាប់ និងកត់ត្រា</td></tr>
            <tr><td>- ដាក់កិច្ចការផ្ទះ</td><td>- ទទួលភារកិច្ច</td></tr>
        `;
    }

    // ២. មុខងារទាញយកជា PDF (ប៊ូតុងទាញយកនឹងដើរ)
    function downloadPDF() {
        const element = document.getElementById('lesson-content');
        const opt = {
            margin:       10,
            filename:     'កិច្ចតែងការបង្រៀន.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // ដំណើរការបង្កើត PDF រួចទាញយក
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
